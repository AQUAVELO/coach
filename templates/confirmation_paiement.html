<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement - AquaCoach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .payment-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .price-card {
            background: linear-gradient(135deg, #e3f4f4 0%, #d0eaea 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .price-title {
            font-size: 18px;
            color: #2c5d63;
            margin-bottom: 10px;
        }
        
        .price-amount {
            font-size: 48px;
            font-weight: bold;
            color: #3fb0ac;
            margin: 10px 0;
        }
        
        .price-subtitle {
            color: #5a7c7f;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c5d63;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0eaea;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3fb0ac;
            box-shadow: 0 0 0 3px rgba(63, 176, 172, 0.1);
        }
        
        .pay-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3fb0ac 0%, #2c8d89 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(63, 176, 172, 0.4);
        }
        
        .security-badge {
            text-align: center;
            margin-top: 20px;
            color: #8a9ea1;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .security-icon {
            font-size: 18px;
        }
        
        .demo-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #856404;
            font-weight: 500;
        }
        
        .card-icons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
            font-size: 24px;
        }
        
        .reservation-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #5a7c7f;
        }
        
        .reservation-info strong {
            color: #2c5d63;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="demo-notice">
            ⚠️ MODE DÉMO - Aucun paiement réel n'est effectué
        </div>
        
        <div class="reservation-info">
            <strong>Paiement pour mise en relation</strong>
        </div>
        
        <div class="price-card">
            <div class="price-title">Frais de dossier</div>
            <div class="price-amount">{{ "%.2f"|format(total) }} €</div>
            <div class="price-subtitle">{{ count }} nageur{{ 's' if count > 1 else '' }} × 2,00 € = {{ "%.2f"|format(total) }} €</div>
        </div>
        
        <form action="{{ url_for('paiement') }}" method="POST">
            <div class="form-group">
                <label>Email :</label>
                <input type="email" name="email" value="{{ client_email }}" readonly style="background-color: #f8f9fa;">
            </div>
            
            <div class="form-group">
                <label>Informations de carte :</label>
                <input type="text" placeholder="4242 4242 4242 4242" value="4242 4242 4242 4242" style="background-color: #f8f9fa;" readonly>
            </div>
            
            <div class="card-icons">
                <span>💳</span>
                <span>💳</span>
                <span>💳</span>
            </div>
            
            <button type="submit" class="pay-button">
                💳 Payer {{ "%.2f"|format(total) }} €
            </button>
            
            <div class="security-badge">
                <span class="security-icon">🔒</span>
                Paiement sécurisé (Mode démo)
                <br>
                <small>Vos données sont simulées et sécurisées</small>
            </div>
        </form>
    </div>
</body>
</html>
