<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb0ac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c8d89;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Wave pattern -->
  <path d="M0,200 Q50,180 100,200 T200,200 T300,200 T400,200 L400,400 L0,400 Z" fill="url(#waveGradient)"/>
  <path d="M0,220 Q50,200 100,220 T200,220 T300,220 T400,220 L400,400 L0,400 Z" fill="url(#waveGradient)" opacity="0.5"/>
  
  <!-- Swimmer icon -->
  <g transform="translate(200, 180)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="35" fill="#ffffff" opacity="0.9"/>
    
    <!-- Swimming cap -->
    <ellipse cx="0" cy="-50" rx="32" ry="20" fill="#ffffff" opacity="0.95"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#ffffff" opacity="0.85"/>
    
    <!-- Arms (swimming position) -->
    <ellipse cx="-50" cy="-10" rx="35" ry="12" fill="#ffffff" opacity="0.8" transform="rotate(-20 -50 -10)"/>
    <ellipse cx="50" cy="10" rx="35" ry="12" fill="#ffffff" opacity="0.75" transform="rotate(20 50 10)"/>
    
    <!-- Legs -->
    <ellipse cx="-20" cy="30" rx="30" ry="12" fill="#ffffff" opacity="0.7" transform="rotate(-10 -20 30)"/>
    <ellipse cx="20" cy="35" rx="30" ry="12" fill="#ffffff" opacity="0.7" transform="rotate(10 20 35)"/>
  </g>
  
  <!-- Bubbles -->
  <circle cx="120" cy="280" r="8" fill="#ffffff" opacity="0.4"/>
  <circle cx="140" cy="300" r="6" fill="#ffffff" opacity="0.35"/>
  <circle cx="160" cy="290" r="10" fill="#ffffff" opacity="0.3"/>
  <circle cx="250" cy="310" r="7" fill="#ffffff" opacity="0.4"/>
  <circle cx="270" cy="295" r="9" fill="#ffffff" opacity="0.35"/>
  
  <!-- Icon swimmer at bottom -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" opacity="0.6">🏊‍♂️</text>
</svg>

